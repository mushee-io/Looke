name: M19 real social Points evidence, anti-abuse and read-only vesting
on:
  pull_request:
    paths:
      - "src/app/social/**"
      - "src/app/page.tsx"
      - "src/app/api/social/points/**"
      - "src/components/experience/M19*"
      - "src/components/experience/m19.css"
      - "src/lib/social/points*"
      - "db/migrations/006_evidence_points_and_vesting.sql"
      - "scripts/social-migrate.ts"
      - "tests/m19-*"
      - "deployment/M19_POINTS_OPERATOR_ACCEPTANCE.md"
      - "package.json"
      - ".github/workflows/m19-evidence-points-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m19-closed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOOKE_PUBLIC_BETA_ENABLED: "false"
      LOOKE_M4_TRADING_ENABLED: "false"
      LOOKE_SOCIAL_WRITES_ENABLED: "false"
      LOOKE_POINTS_ACCOUNTING_ENABLED: "false"
      LOOKE_M6_EVIDENCE_ENABLED: "false"
      LOOKE_MEDIA_UPLOADS_ENABLED: "false"
      LOOKE_M4_MARKETS_JSON: "[]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Fail-closed Testnet preflight
        run: npm run m7:preflight
      - name: Evidence source, integer vesting and full pure regression suite
        run: npm test
      - name: TypeScript and Next.js production build
        run: |
          npm run typecheck
          npm run build
      - name: Running Next.js anti-claim Preview smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 >/tmp/m19-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          for route in points points/operator; do
            code=$(curl -s -o /tmp/m19-get.json -w "%{http_code}" \
              http://127.0.0.1:3100/api/social/"$route")
            test "$code" = "401"
          done
          code=$(curl -s -o /tmp/m19-post.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3100/api/social/points/operator \
            -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            -d '{"action":"queue","seasonId":"11111111-1111-4111-8111-111111111111","kind":"post","sourceId":"22222222-2222-4222-8222-222222222222"}')
          test "$code" = "503"
          code=$(curl -s -o /tmp/m19-claim.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3100/api/social/points \
            -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            -d '{"action":"claim"}')
          test "$code" = "405"
          curl -fsS http://127.0.0.1:3100/api/experience/messaging/readiness | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const a=JSON.parse(s);
              if(a.liveMessagingEnabled!==false||a.messagesSent!==0)process.exit(2);
            });
          '
          npm run m7:smoke
      - name: Existing rollback rehearsal
        run: npm run m8:rollback-rehearsal
      - name: Explicit closed Preview release statement
        if: always()
        run: |
          echo "M19 has no token issuance, reward claim, minting, payout, transaction or E2EE messaging endpoint." >> "$GITHUB_STEP_SUMMARY"
          echo "M19 awards stay pending until checked against genuine social evidence and explicitly approved." >> "$GITHUB_STEP_SUMMARY"
          echo "Only audited off-chain Points are vestable; no preallocated or fictitious balances." >> "$GITHUB_STEP_SUMMARY"
          echo "Production, public beta, social writes and Points review remain OFF." >> "$GITHUB_STEP_SUMMARY"
