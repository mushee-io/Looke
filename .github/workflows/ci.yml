name: Looke checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: M1 Ultra EVM-only wallet, network and retired-native acceptance
        run: npm run test:final-m1
      - run: npm run typecheck
      - run: npm run build
      - name: M34 protected end-to-end acceptance smoke and POST denial
        env:
          VERCEL_ENV: preview
          LOOKE_PUBLIC_BETA_ENABLED: 'false'
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_M4_TRADING_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 >/tmp/m34-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:3100/api/experience/m34-final?mode=config' | node -e '
            let x="";process.stdin.on("data",s=>x+=s).on("end",()=>{
              const r=JSON.parse(x);
              if(r.milestone!=="M34_FINAL"||r.releaseDecision!=="NO_GO"||
                 r.publicBetaOpen!==false||r.liveSourcesQueried!==false||
                 r.transactionsSent!==0||r.databasesModified!==0||
                 r.originalHumanApprovals!==0)process.exit(2);
            });
          '
          code=$(curl -s -o /tmp/m34-post.json -w "%{http_code}" -X POST \
            http://127.0.0.1:3100/api/experience/m34-final \
            -H 'Content-Type: application/json' -d '{"approve":true}')
          test "$code" = "405"
          curl -fsS --max-time 30 'http://127.0.0.1:3100/api/ultra-evm/health' | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const a=JSON.parse(s);
              if(a.milestone!=="M1"||a.networkPolicy!=="ultra-evm-only"||
                 a.testnet.chainId!==18881||a.mainnet.chainId!==19991||
                 a.activeChainId!==18881||a.mainnetTransactionsEnabled!==false||
                 a.publicBetaOpen!==false||a.transactionsSent!==0||a.releaseDecision!=="NO_GO"||
                 !["verified","unavailable"].includes(a.testnet.status)||
                 !["verified","unavailable"].includes(a.mainnet.status))process.exit(2);
            });
          '
          code=$(curl -s -o /tmp/m1-retired.json -w "%{http_code}" \
            'http://127.0.0.1:3100/api/uniqs?kind=status')
          test "$code" = "410"
          curl -fsS http://127.0.0.1:3100/uniqs | grep -q 'Ultra EVM'
          code=$(curl -s -o /tmp/m1-method.json -w "%{http_code}" -X POST \
            http://127.0.0.1:3100/api/ultra-evm/health)
          test "$code" = "405"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vv

  social_db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: looke_social_ci
          POSTGRES_USER: looke_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looke_ci -d looke_social_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply existing and M15 moderated-media migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
      - name: Run M8 READ-ONLY disposable social DB operational audit
        run: npm run m8:db-audit
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_M8_ALLOW_LOCAL_PLAINTEXT_DB: 'true'
      - name: Run signed auth and social DB integration tests
        run: npm run test:social-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
      - name: Verify media moderation approval visibility and SQL constraints (disposable DB)
        run: npm run test:m15-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
      - name: Verify signed upload ownership, one-time attachment and account-scoped notifications
        run: npm run test:m16-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
      - name: Verify creator likes, reposts, private bookmarks and notification boundaries
        run: npm run test:m17-db
