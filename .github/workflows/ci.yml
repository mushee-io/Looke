name: Looke checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vv

  social_db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: looke_social_ci
          POSTGRES_USER: looke_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looke_ci -d looke_social_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply existing and M15 moderated-media migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
      - name: Run M8 READ-ONLY disposable social DB operational audit
        run: npm run m8:db-audit
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_M8_ALLOW_LOCAL_PLAINTEXT_DB: 'true'
      - name: Run signed auth and social DB integration tests
        run: npm run test:social-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
      - name: Verify media moderation approval visibility and SQL constraints (disposable DB)
        run: npm run test:m15-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
      - name: Verify signed upload ownership, one-time attachment and account-scoped notifications
        run: npm run test:m16-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
      - name: Verify creator likes, reposts, private bookmarks and notification boundaries
        run: npm run test:m17-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
      - name: Verify M18 moderator isolation, report review audit and creator account controls
        run: npm run test:m18-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
      - name: Verify real source-backed Looke Points, anti-farming constraints, reviews and vesting
        run: npm run test:m19-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'true'
      - name: Verify M20 indexed creator events, transactional replay and real Points reconciliation
        run: npm run test:m20-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
          LOOKE_M20_INDEX_WRITES_ENABLED: 'true'

      - name: M21 adversarial signed wallet, media, moderation, Points and recovery integration
        run: npm run test:m21-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'true'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'true'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'true'
          LOOKE_M20_INDEX_WRITES_ENABLED: 'true'

      - name: M22 protected-beta moderator isolation, genuine creator records, signature and backup checks
        run: npm run test:m22-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M20_INDEX_WRITES_ENABLED: 'false'

      - name: M23 real one-use EIP-191 acceptance, cross-wallet protection, external audit signatures and points drift
        run: npm run test:m23-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M20_INDEX_WRITES_ENABLED: 'false'
          LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: 'true'

      - name: M24 full 17-table PostgreSQL restore digests, linked evidence and incident no-execution review
        run: npm run test:m24-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M20_INDEX_WRITES_ENABLED: 'false'
          LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: 'false'
          LOOKE_M24_INCIDENT_WRITES_ENABLED: 'true'

      - name: M25 independent reviewer signatures, source-bound release NO-GO, wallet isolation and PostgreSQL evidence
        run: npm run test:m25-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_PUBLIC_BETA_ENABLED: 'false'
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: 'false'
          LOOKE_M24_INCIDENT_WRITES_ENABLED: 'false'
          LOOKE_M25_REVIEW_WRITES_ENABLED: 'true'

      - name: M26 full 18-table disaster-recovery hash and dual-role signed-reference isolation
        run: npm run test:m26-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_PUBLIC_BETA_ENABLED: 'false'
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: 'true'
          LOOKE_M25_REVIEW_WRITES_ENABLED: 'true'
          LOOKE_M26_WITNESS_WRITES_ENABLED: 'true'

      - name: M27 full 19-table witness-ledger restore digest, complete Points sources and protected acceptance
        run: npm run test:m27-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_PUBLIC_BETA_ENABLED: 'false'
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M20_INDEX_WRITES_ENABLED: 'false'
          LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: 'true'
          LOOKE_M26_WITNESS_WRITES_ENABLED: 'true'

      - name: M28 real media isolation, independent chain proof denial, wallet observers and 19-table PostgreSQL recovery
        run: npm run test:m28-db
        env:
          DATABASE_URL: postgres://looke_ci:ci_only_password@localhost:5432/looke_social_ci
          LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
          LOOKE_PUBLIC_BETA_ENABLED: 'false'
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_MEDIA_UPLOADS_ENABLED: 'false'
          LOOKE_POINTS_ACCOUNTING_ENABLED: 'false'
          LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: 'false'
          LOOKE_M25_REVIEW_WRITES_ENABLED: 'false'
          LOOKE_M26_WITNESS_WRITES_ENABLED: 'false'
