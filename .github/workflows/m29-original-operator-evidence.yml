name: M29 authentic operator evidence, consumed nonce crosscheck and immutable beta NO-GO
on:
  pull_request:
    paths:
      - "src/lib/beta/m29-*"
      - "src/app/api/social/ops/m29/**"
      - "src/components/experience/M29*"
      - "src/components/experience/m29.css"
      - "src/app/social/**"
      - "scripts/m29-*"
      - "tests/m29-*"
      - "deployment/M29_REAL_EVIDENCE_OPERATOR_RUNBOOK.md"
      - "package.json"
      - ".github/workflows/m29-original-operator-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m29-closed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOOKE_PUBLIC_BETA_ENABLED: "false"
      LOOKE_M4_TRADING_ENABLED: "false"
      LOOKE_SOCIAL_WRITES_ENABLED: "false"
      LOOKE_MEDIA_UPLOADS_ENABLED: "false"
      LOOKE_POINTS_ACCOUNTING_ENABLED: "false"
      LOOKE_M20_INDEX_WRITES_ENABLED: "false"
      LOOKE_M23_ACCEPTANCE_WRITES_ENABLED: "false"
      LOOKE_M24_INCIDENT_WRITES_ENABLED: "false"
      LOOKE_M25_REVIEW_WRITES_ENABLED: "false"
      LOOKE_M26_WITNESS_WRITES_ENABLED: "false"
      LOOKE_M6_EVIDENCE_ENABLED: "false"
      LOOKE_M4_MARKETS_JSON: "[]"
      LOOKE_SOCIAL_APP_ORIGIN: "https://looke-ci.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: All source-backed signature and real-file adversarial unit tests
        run: |
          npm run m7:preflight
          npm test
      - name: Full static verification and closed deployment build
        run: |
          npm run typecheck
          npm run build
      - name: Independent Ultra Testnet heads and immutable beta NO-GO
        run: |
          npm run m21:acceptance
          npm run m22:preflight
          node - <<'NODE'
          const fs=require("node:fs");
          const p=JSON.parse(fs.readFileSync("artifacts/m22/preflight.json","utf8"));
          if(p.report.releaseDecision!=="NO_GO"||p.report.publicBetaOpen!==false||
             p.report.mayActivate!==false||p.report.flagsClosed!==true||
             p.transactionsSent!==0)process.exit(2);
          console.log("M29 operator evidence is read-only. Public beta NO-GO.");
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: looke-m29-readonly-no-go
          path: |
            artifacts/m21/acceptance.json
            artifacts/m22/preflight.json
          retention-days: 7
          if-no-files-found: warn
      - name: Closed operator routes, no financial broadcasts, media and claims disabled
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 >/tmp/m29-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          for route in ops/m29 ops/m28 ops/m27 ops/m26 ops/acceptance; do
            code=$(curl -s -o /tmp/m29-get.json -w "%{http_code}" \
              http://127.0.0.1:3100/api/social/"$route")
            echo "Protected $route HTTP=$code"
            test "$code" = "401"
          done
          code=$(curl -s -o /tmp/m29-write.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3100/api/social/ops/m29 \
            -H 'Origin: https://looke-ci.invalid' -H 'Content-Type: application/json' \
            -d '{"action":"approve_public_beta"}')
          test "$code" = "405"
          code=$(curl -s -o /tmp/m29-claim.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3100/api/social/points \
            -H 'Origin: https://looke-ci.invalid' -H 'Content-Type: application/json' \
            -d '{"action":"claim"}')
          test "$code" = "405"
          curl -fsS http://127.0.0.1:3100/api/experience/media | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const a=JSON.parse(s);if(a.enabled!==false||a.moderationRequired!==true)process.exit(2);
            });
          '
          curl -fsS http://127.0.0.1:3100/api/experience/messaging/readiness | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const a=JSON.parse(s);if(a.liveMessagingEnabled!==false||a.messagesSent!==0)process.exit(2);
            });
          '
          npm run m7:smoke
      - name: Non-destructive existing rollback runbook preflight
        run: npm run m8:rollback-rehearsal
      - name: Genuine source evidence requirements remain unverified
        if: always()
        run: |
          echo "The workflow tests only EPHEMERAL wallet signatures and disposable SQL rows; no real external human identities or provider artifacts are fabricated." >> "$GITHUB_STEP_SUMMARY"
          echo "The operator M29 scripts require actual file bytes, two independently allowlisted signed reviews and real M23 consumed database challenges." >> "$GITHUB_STEP_SUMMARY"
          echo "Actual media provider content review, canonical Ultra asset proofs, separate real TLS restoration, external audit findings and witnessed rollback require separately supplied genuine operator evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "Public beta, social/media, Points, token minting/claims, financial broadcasting, private messaging and production deployment remain closed. No recurring schedule is created." >> "$GITHUB_STEP_SUMMARY"
